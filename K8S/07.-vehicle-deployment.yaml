apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: jsw-gps
  name: vehicle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle
  template:
    metadata:
      labels:
        app: vehicle
    spec:
      containers:
        - name: vehicle
          image: jsantos92/db_stack_dev-vehicle-ms:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: vehicle-config
            - secretRef:
                name: vehicle-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi